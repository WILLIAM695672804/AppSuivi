# Serveur de messages en production : compte obligatoire.
#
# Sur l'ordinateur de développement, l'accès anonyme est commode et sans
# conséquence. Sur une machine joignable depuis Internet, il permettrait à
# n'importe qui de publier de fausses mesures — donc de déclencher de fausses
# alertes incendie — ou de lire toutes les alertes d'un site industriel.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

# Le port n'est pas publié hors du réseau des conteneurs (voir
# docker-compose.production.yml) : seuls les services de SASI l'atteignent.
# Pour y brancher un jumeau extérieur, publier 8883 avec les lignes suivantes
# et un certificat :
#   listener 8883
#   certfile /mosquitto/certs/fullchain.pem
#   keyfile  /mosquitto/certs/privkey.pem
